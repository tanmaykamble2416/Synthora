# RESEARCHMIND — local infrastructure.
#   Day 1: PostgreSQL 16 + pgvector.
#   Day 6: GROBID (optional document-structure service).
# Redis, the backend and the frontend are added on the days they are needed.
name: researchmind

services:
  postgres:
    # Official pgvector image = postgres:16 + the pgvector extension pre-compiled.
    # After the first pull, pin the exact tag for reproducibility (see README).
    image: pgvector/pgvector:pg16
    container_name: researchmind-postgres
    restart: unless-stopped
    environment:
      # ":?" makes Compose fail loudly if a variable is missing instead of
      # silently starting a database with an empty password.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      # Bound to 127.0.0.1 so the database is NOT exposed to your LAN/Wi-Fi.
      # Host port defaults to 5433 to avoid clashing with a locally installed Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run ONCE, only when the data volume is empty.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grobid:
    # Day 6. OPTIONAL: when it is stopped or unhealthy, extraction still succeeds with
    # page-based chunks (structure_source = page_fallback). Enable it in .env with
    # GROBID_ENABLED=true. CRF-only CPU image (~500 MB); the full "-full" image is ~8 GB.
    # After the first pull, pin the digest for reproducibility (see README).
    image: grobid/grobid:0.9.1-crf
    container_name: researchmind-grobid
    restart: unless-stopped
    # Recommended by GROBID: an init process reaps the PDF-parsing child processes, and
    # core dumps are disabled so a crashing PDF cannot fill the disk.
    init: true
    ulimits:
      core: 0
    ports:
      # Bound to 127.0.0.1: GROBID has no authentication and must not be reachable from the LAN.
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"
    # No volume: GROBID keeps no data. Full-text processing needs about 4 GB of RAM.
    healthcheck:
      # The image ships neither curl nor wget; bash's /dev/tcp is enough to call /api/isalive.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8070 && printf 'GET /api/isalive HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q true <&3"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
