# RESEARCHMIND — local infrastructure (Day 1: PostgreSQL 16 + pgvector only).
# Redis, GROBID, the backend and the frontend are added on the days they are needed.
name: researchmind

services:
  postgres:
    # Official pgvector image = postgres:16 + the pgvector extension pre-compiled.
    # After the first pull, pin the exact tag for reproducibility (see README).
    image: pgvector/pgvector:pg16
    container_name: researchmind-postgres
    restart: unless-stopped
    environment:
      # ":?" makes Compose fail loudly if a variable is missing instead of
      # silently starting a database with an empty password.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      # Bound to 127.0.0.1 so the database is NOT exposed to your LAN/Wi-Fi.
      # Host port defaults to 5433 to avoid clashing with a locally installed Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run ONCE, only when the data volume is empty.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
